<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 Part 1: Basic Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">O</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Part 1 (HTML Forms)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="task2.html">Part 2 (Bootstrap Forms)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="task4.html">Part 3 (Registration Form)</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="custom-card">
                    <h2 class="mb-3">Contact Us</h2>
                    <p class="text-muted mb-4">Basic HTML Form + HTML5 Validation</p>

                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="userName" class="form-label fw-bold">Name:</label>
                            <input type="text" id="userName" name="userName" class="form-control" placeholder="Enter your name" required minlength="2">
                        </div>

                        <div class="mb-3">
                            <label for="userEmail" class="form-label fw-bold">Email:</label>
                            <input type="email" id="userEmail" name="userEmail" class="form-control" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="userMessage" class="form-label fw-bold">Message:</label>
                            <textarea id="userMessage" name="userMessage" class="form-control" rows="4" placeholder="Write your message here..." required maxlength="300"></textarea>
                        </div>

                        <button type="submit" class="btn btn-dark w-100">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">made by Oleksandr</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
